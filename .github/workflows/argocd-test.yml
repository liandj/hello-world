name: CI/CD Pipeline

on:
  push:
    branches:
      - argocd-test  # 触发分支

jobs:
  build-and-deploy:
    runs-on: macOS
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to GitHub Container Registry
        run: |
          docker logout ghcr.io
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin    

      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.run_number }}

      # 4. 修改 deployment.yaml 中的镜像标签
      - name: Update Image in Kubernetes Manifest
        run: |
          # 使用 sed 替换镜像名称（确保路径正确）
          sed -i "s|image:.*|image: ghcr.io/${{ github.repository }}:${{ github.run_number }}|" ./deploy/deployment.yaml

      # 5. 提交修改后的 deployment.yaml（可选：若配置仓库与代码仓库分离需调整）
      - name: Commit Manifest Changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add ./k8s/deployment.yaml
          git commit -m "Update image to ${{ github.sha }}"
          git push

      # 6. 触发 ArgoCD 同步（通过 API）
      - name: ArgoCD Action
        run: echo "edit deployment success"
