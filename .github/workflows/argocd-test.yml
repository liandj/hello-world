name: CI/CD Pipeline

on:
  push:
    branches:
      - argocd-test  # 触发分支

jobs:
  build-and-deploy:
    runs-on: kino-devops
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
        
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  

      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.run_number }}
          
      # 5. 提交修改后的 deployment.yaml（可选：若配置仓库与代码仓库分离需调整）
      - name: Commit Manifest Changes
        env:
          PAT: ${{ secrets.PAT_TOKEN }} 
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          sed -i "s|image:.*|image: ghcr.io/${{ github.repository }}:${{ github.run_number }}|" ./deploy/deployment.yaml
          git add ./deploy/deployment.yaml
          git commit -m "Update image to ${{ github.sha }}"
          echo "https://${{ github.actor }}@github.com/${{ github.repository }}.git"
          git remote set-url origin https://${{ github.actor }}:$PAT@github.com/${{ github.repository }}.git
          git push origin argocd-test

      # 6. 触发 ArgoCD 同步（通过 API）
      - name: ArgoCD Action
        run: echo "edit deployment success"
